name: CI

on:
  push:
    branches: [main, "release/**", "support/**"]
  pull_request:
    branches: [main]
  # The release workflow runs the full suite before it publishes
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Run ruff check
        run: uv run --locked --only-group dev ruff check .

      - name: Run ruff format check
        run: uv run --locked --only-group dev ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      # Sets UV_PYTHON, so uv uses this version instead of .python-version
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      # The ESM bundle tests parse and run the widget's JavaScript with Node (the tsc, jsdom and stale-bundle
      # checks need node_modules and skip here: the frontend job runs them once)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --locked --extra dev pytest

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # esbuild, TypeScript and the type packages, so tsc can check every module in src/ and tests/js/
      - name: Install the front-end dependencies
        run: npm ci --ignore-scripts

      - name: Install the JavaScript test dependencies
        run: npm ci --ignore-scripts --prefix tests/js

      - name: Check that the committed bundles are built from the current sources
        run: npm run check

      - name: Type-check the front end
        run: npm run typecheck

      - name: Run the JavaScript tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check dist/*
