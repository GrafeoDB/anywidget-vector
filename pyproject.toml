[project]
name = "anywidget-vector"
version = "1.1.0"
description = "Interactive 3D vector visualization with query UI for vector databases"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "S.T. Grond", email = "dev@grafeo.dev" }]
keywords = ["anywidget", "vector", "visualization", "jupyter", "marimo"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "anywidget>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "prek>=0.5.11",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
    "marimo>=0.25.2",
    # The test suite includes contract tests against the Grafeo engine
    "grafeo>=0.6.3,<0.7",
    # The demo tests read the Silicon Valley dataset
    "grafeo-datasets>=0.6.3",
    "numpy>=2.5.5",
    # Compares the npm and PyPI spellings of the engine version
    "packaging>=26.3",
]
pandas = ["pandas>=3.1.1"]
numpy = ["numpy>=2.5.5"]
qdrant = ["qdrant-client>=1.20.0"]
# chromadb 1.5.9 has security issues; pinned until a fixed release
chroma = ["chromadb==1.5.8"]
pinecone = ["pinecone-client>=6.0.0"]
weaviate = ["weaviate-client>=4.24.1"]
lancedb = ["lancedb>=0.41.0"]
grafeo = ["grafeo>=0.6.3,<0.7"]
projection = ["scikit-learn>=1.9.1", "umap-learn>=0.6.0"]
embed = []  # Marker extra: WASM loads from CDN on demand
# The Silicon Valley dataset for demo_vector(); numpy projects its embeddings to 3D
demo = ["grafeo-datasets>=0.6.3", "numpy>=2.5.5"]
all = [
    "pandas>=3.1.1",
    "numpy>=2.5.5",
    "qdrant-client>=1.20.0",
    "chromadb==1.5.8",
    "pinecone-client>=6.0.0",
    "weaviate-client>=4.24.1",
    "lancedb>=0.41.0",
]

[project.urls]
Homepage = "https://grafeo.dev/"
Repository = "https://github.com/GrafeoDB/anywidget-vector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_vector"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "examples",
    "scripts",
    "assets",
    ".github",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    "uv.lock",
    ".python-version",
    ".gitignore",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
# ruff 0.17 also formats Python blocks in Markdown; the README keeps its aligned comments
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/anywidget_vector/widget.py" = ["E501"]  # Long lines in embedded JS
"src/anywidget_vector/ui/__init__.py" = ["E501"]  # Long lines in embedded JS
"examples/**" = ["B007", "B018"]  # Marimo cells use bare expressions for output

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
# examples/ import optional demo-only packages (matplotlib, polars, wigglystuff)
exclude = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.prek]
repos = [
    { repo = "ruff", hooks = [
        { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
        { id = "ruff-format" },
    ]},
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
