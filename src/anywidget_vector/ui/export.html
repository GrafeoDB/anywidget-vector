<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{title}</title>
<style>
/* The widget's colour, type and shape variables (the design-tokens block of ui/styles.css) */
{theme_css}
body {{ margin: 0; overflow: hidden; font-family: var(--avs-font-body); background: var(--avs-bg); color: var(--avs-text); }}
#container {{ width: {width}; height: {height}; position: relative; }}
/* The widget's tooltip (.avs-tooltip in ui/styles.css) */
.tooltip {{
  display: none;
  position: absolute;
  background: var(--avs-surface);
  border: 1px solid var(--avs-border);
  color: var(--avs-text);
  padding: 8px 12px;
  border-radius: var(--avs-radius-box);
  font-size: 12px;
  pointer-events: none;
  z-index: 100;
  max-width: 250px;
  box-shadow: var(--avs-shadow-float);
}}
.tooltip-label {{ font-weight: 600; margin-bottom: 4px; }}
.tooltip-row {{ display: flex; justify-content: space-between; gap: 12px; }}
.tooltip-key {{ color: var(--avs-text-muted); }}
</style>
</head>
<body class="{theme_class}">
<div id="container"></div>
<div id="tooltip" class="tooltip"></div>
<script type="module">
// Three.js and OrbitControls, bundled with anywidget-vector (licenses: ui/vendor/three.LICENSES.txt)
{vendor_js}

// The points and the visual settings of the exported view
const DATA = {json_data};
const OPTIONS = {json_options};

// the standalone renderer, bundled from ui/export.ts by scripts/build-esm.mjs
{export_js}
</script>
</body>
</html>
